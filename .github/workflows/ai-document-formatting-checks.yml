name: Frontend checks

on:
  push:
    branches:
      - feature/ai-document-formatting
  pull_request:
    branches:
      - feature/ai-document-formatting

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicedocs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voicedocs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build frontend
        run: npm run build
